name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -t . -v
      - name: Los ejemplos correctos pasan
        run: |
          for f in validador_uml/ejemplos/*_correcto.*; do
            python -m validador_uml revisar "$f"
          done
