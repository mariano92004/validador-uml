name: Ejecutable para Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Dependencias
        run: python -m pip install pywebview pyinstaller
      - name: Pruebas
        run: python -m unittest discover -s tests -t .
      - name: ValidadorUML.exe
        run: python empaquetado/construir.py
      - uses: actions/upload-artifact@v7
        with:
          name: ValidadorUML
          path: dist/ValidadorUML.exe
      - name: Adjuntar a la versión
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/ValidadorUML.exe --generate-notes --title "Validador UML ${{ github.ref_name }}"
